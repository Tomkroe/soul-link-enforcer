name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Lua 5.1 (wie DeSmuME) und luacheck installieren
        run: sudo apt-get update && sudo apt-get install -y lua5.1 lua-check
      - run: npm ci
      - name: Statische Prüfung (luacheck)
        run: npm run lint
      - run: npm test
